name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure & Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.3.1463
          bb: 1.3.190
          clj-kondo: 2024.03.13

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: bb lint

      - name: Build CSS & CLJS Assets
        run: bb build

      - name: Run Backend JVM Tests
        run: bb test

      - name: Validate Dev REPL Boot & In-REPL Execution
        run: bb test-repl-boot

      - name: Run Frontend & Proxy Tests
        run: |
          bb fe-test
          node ssr-server/test_proxy.js
